server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls: strip /api and pass to the backend container
    location /api/ {
        proxy_pass http://backend:3000/;     # the trailing "/" removes the /api prefix
        proxy_set_header Host $host;
        proxy_read_timeout 60s;              # longer than the LLM timeout
    }

    # Single-page app: unknown paths (/tasks/create) get index.html, React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }
}
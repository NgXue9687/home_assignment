services:
  postgresql:
    container_name: htx-db
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1m30s
      timeout: 5s
      retries: 5
    environment:
      TZ: Asia/Singapore
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: p@ssw0rd
    volumes:
      - "./containers/postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro"
      - "pgdata:/var/lib/postgresql"
    ports:
      - "5432:5432"

volumes:
  pgdata:
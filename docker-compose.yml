services:
  postgresql:
    container_name: htx-db
    image: postgres:18
    environment:
      TZ: Asia/Singapore
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: p@ssw0rd
    volumes:
      - "./containers/postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro"
      - "pgdata:/var/lib/postgresql"
    ports:
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1: only "ready" once the real server is up, after the init scripts
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin_user"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    container_name: htx-backend
    build: ./webapp
    env_file:                     # LLM key and DB password come from here
      - path: ./webapp/.env 
      - path: ./webapp/.env.local
        required: false 
    environment:
      DB_HOST: postgresql            # overrides "localhost" from .env: inside Docker the DB is this service
      DB_PORT: 5432
    depends_on:
      postgresql:
        condition: service_healthy   # wait until the database is ready
    ports:
      - "3000:3000"                  # optional: lets you call the API directly

  frontend:
    container_name: htx-frontend
    build: ./portal/hrms
    depends_on:
      - backend
    ports:
      - "4000:80"                    # open http://localhost:4000

volumes:
  pgdata: